<style>
    /* Page-specific styles (kept inline to avoid touching css/style.css) */
    .projects-toolbar {
        display: flex; gap: 12px; align-items: center;
        margin-bottom: 20px; flex-wrap: wrap;
    }
    .projects-toolbar .search-input {
        flex: 1; min-width: 220px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px; padding: 10px 14px;
        color: #fff; font-family: inherit; font-size: 14px;
    }
    .projects-toolbar .search-input:focus {
        outline: none; border-color: #7c3aed;
    }
    .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
    }
    .project-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px; padding: 20px;
        cursor: pointer; transition: all 0.2s ease;
        display: flex; flex-direction: column; gap: 10px;
    }
    .project-card:hover {
        border-color: #7c3aed;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(124,58,237,0.15);
    }
    .project-card-head {
        display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .project-card-title {
        font-weight: 700; font-size: 16px; color: #fff;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .project-card-desc {
        color: #a0a0b8; font-size: 13px; line-height: 1.5;
        display: -webkit-box; -webkit-line-clamp: 2;
        -webkit-box-orient: vertical; overflow: hidden;
    }
    .project-card-meta {
        display: flex; gap: 12px; font-size: 12px; color: #6b7280;
        margin-top: auto; padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.06);
    }
    .badge-status {
        display: inline-block; padding: 3px 8px; border-radius: 999px;
        font-size: 11px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .badge-active { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-disabled { background: rgba(239,68,68,0.15); color: #f87171; }
    .badge-archived { background: rgba(107,114,128,0.15); color: #9ca3af; }

    .pagination {
        display: flex; justify-content: center; gap: 8px; margin-top: 24px;
    }
    .pagination button {
        min-width: 36px; height: 36px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        color: #fff; border-radius: 6px; cursor: pointer;
        font-family: inherit; font-size: 13px;
    }
    .pagination button.active {
        background: #7c3aed; border-color: #7c3aed;
    }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Modal */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.7);
        display: none; align-items: center; justify-content: center;
        z-index: 1000; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
        background: #14141f;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px; padding: 28px;
        max-width: 560px; width: 100%;
        max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { margin: 0 0 20px 0; color: #fff; font-size: 22px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
        display: block; margin-bottom: 6px;
        color: #d1d5db; font-size: 13px; font-weight: 500;
    }
    .form-group input, .form-group textarea, .form-group select {
        width: 100%; box-sizing: border-box;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px; padding: 10px 12px;
        color: #fff; font-family: inherit; font-size: 14px;
    }
    .form-group textarea { min-height: 100px; resize: vertical; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
        outline: none; border-color: #7c3aed;
    }
    .modal-actions {
        display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;
    }

    /* Detail panel — full-screen overlay */
    .detail-panel {
        position: fixed; inset: 0; background: #0a0a12;
        z-index: 900; display: none; overflow-y: auto;
    }
    .detail-panel.show { display: block; }
    .detail-header {
        padding: 24px 32px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex; justify-content: space-between; align-items: center; gap: 20px;
    }
    .detail-header .back-btn {
        background: none; border: none; color: #a0a0b8; font-size: 14px;
        cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .detail-header .back-btn:hover { color: #fff; }
    .detail-title { color: #fff; font-size: 24px; font-weight: 700; margin: 0; }
    .detail-tabs {
        display: flex; gap: 4px; padding: 0 32px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .detail-tabs button {
        background: none; border: none; color: #a0a0b8;
        padding: 14px 18px; cursor: pointer; font-size: 14px;
        border-bottom: 2px solid transparent; font-family: inherit;
    }
    .detail-tabs button.active {
        color: #fff; border-bottom-color: #7c3aed;
    }
    .detail-content { padding: 28px 32px; }
    .stat-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px; margin-bottom: 24px;
    }
    .stat-box {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 10px; padding: 16px;
    }
    .stat-box .stat-label {
        font-size: 12px; color: #a0a0b8; text-transform: uppercase;
        letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .stat-box .stat-value {
        font-size: 24px; font-weight: 700; color: #fff;
    }
    .data-table {
        width: 100%; border-collapse: collapse; font-size: 13px;
    }
    .data-table th, .data-table td {
        text-align: left; padding: 10px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .data-table th {
        color: #a0a0b8; font-weight: 600; font-size: 12px;
        text-transform: uppercase; letter-spacing: 0.5px;
    }
    .data-table td { color: #e5e7eb; }
    .data-table .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .empty-state {
        text-align: center; padding: 60px 20px; color: #6b7280;
    }
    .empty-state h3 { color: #d1d5db; margin-bottom: 8px; }

    .code-block {
        background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px; padding: 14px;
        font-family: 'JetBrains Mono', monospace; font-size: 12px;
        color: #d1d5db; white-space: pre-wrap; word-break: break-all;
    }
    .row-actions { display: flex; gap: 6px; }
    .btn-sm {
        padding: 5px 10px; font-size: 12px; border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.04); color: #fff; cursor: pointer;
        font-family: inherit;
    }
    .btn-sm:hover { background: rgba(255,255,255,0.08); }
    .btn-danger-sm { color: #f87171; border-color: rgba(239,68,68,0.3); }
    .btn-danger-sm:hover { background: rgba(239,68,68,0.15); }
</style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="bg-grid"></div>

<!-- Loading overlay -->
<div id="authLoader" style="position:fixed; inset:0; background:var(--bg-primary); display:flex; align-items:center; justify-content:center; z-index:9999;">
    <div class="spinner"></div>
</div>

<div class="dashboard-layout" style="display:none;" id="projectsMain">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="logo">
                <svg class="logo-mark" width="24" height="24" viewBox="0 0 32 32" fill="none">
                    <path d="M16 2L4 9v14l12 7 12-7V9L16 2z" stroke="url(#logoGrad)" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M16 10v12M11 13l5-3 5 3M11 19l5 3 5-3" stroke="url(#logoGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="4" y1="2" x2="28" y2="30">
                            <stop offset="0%" stop-color="#7c3aed"/>
                            <stop offset="100%" stop-color="#ec4899"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="logo-text">NexaKS</span>
            </a>
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-section-title">Main</div>
            <a href="dashboard.html">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 12l9-9 9 9M5 10v10h4v-6h6v6h4V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Dashboard
            </a>
            <a href="projects.html" class="active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Projects
            </a>
            <a href="#" id="signOutBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Sign out
            </a>
        </nav>
    </aside>

    <!-- Main content -->
    <main class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;">
            <div>
                <h1 style="color:#fff; margin:0; font-size:28px;">My Projects</h1>
                <p style="color:#a0a0b8; margin:6px 0 0 0; font-size:14px;">
                    Manage your script keys, whitelists, and analytics per project.
                </p>
            </div>
            <button class="btn btn-primary" onclick="openCreateModal()">
                + New Project
            </button>
        </div>

        <div class="projects-toolbar">
            <input type="text" id="searchInput" class="search-input"
                   placeholder="Search projects by name or description…"
                   oninput="onSearchInput()">
            <label style="color:#a0a0b8; font-size:13px; display:flex; align-items:center; gap:6px;">
                <input type="checkbox" id="showArchived" onchange="loadProjects()">
                Show archived
            </label>
        </div>

        <div id="projectsGrid" class="projects-grid">
            <!-- Populated by JS -->
        </div>

        <div id="pagination" class="pagination"></div>

        <div id="emptyState" class="empty-state" style="display:none;">
            <h3>No projects yet</h3>
            <p>Create your first project to start managing script keys.</p>
            <button class="btn btn-primary" style="margin-top:16px;" onclick="openCreateModal()">
                + Create Project
            </button>
        </div>
    </main>
</div>

<!-- ================= CREATE / EDIT MODAL ================= -->
<div class="modal-overlay" id="projectModal">
    <div class="modal">
        <h2 id="modalTitle">New Project</h2>
        <form id="projectForm" onsubmit="submitProject(event)">
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>Name *</label>
                <input type="text" id="fName" required maxlength="80" placeholder="My Awesome Script">
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="fDesc" maxlength="500" placeholder="Brief description">
            </div>
            <div class="form-group">
                <label>Version</label>
                <input type="text" id="fVersion" value="1.0.0" maxlength="20">
            </div>
            <div class="form-group">
                <label>Script / Loader (Lua source)</label>
                <textarea id="fScript" placeholder="-- Your Lua script here"></textarea>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="fStatus">
                    <option value="active">Active</option>
                    <option value="disabled">Disabled</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">Create</button>
            </div>
        </form>
    </div>
</div>

<!-- ================= DETAIL PANEL ================= -->
<div class="detail-panel" id="detailPanel">
    <div class="detail-header">
        <div style="display:flex; align-items:center; gap:20px;">
            <button class="back-btn" onclick="closeDetail()">← Back</button>
            <div>
                <h2 class="detail-title" id="dName">—</h2>
                <div style="color:#a0a0b8; font-size:13px; margin-top:4px;">
                    <span id="dMeta"></span>
                </div>
            </div>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn-sm" onclick="editCurrentProject()">Edit</button>
            <button class="btn-sm" onclick="toggleArchive()">Archive</button>
            <button class="btn-sm btn-danger-sm" onclick="deleteCurrentProject()">Delete</button>
        </div>
    </div>

    <div class="detail-tabs">
        <button class="active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
        <button data-tab="keys" onclick="switchTab('keys')">Keys</button>
        <button data-tab="whitelist" onclick="switchTab('whitelist')">Whitelist</button>
        <button data-tab="blacklist" onclick="switchTab('blacklist')">Blacklist</button>
        <button data-tab="logs" onclick="switchTab('logs')">Logs</button>
        <button data-tab="settings" onclick="switchTab('settings')">Settings</button>
    </div>

    <div class="detail-content" id="detailContent">
        <!-- Populated by switchTab() -->
    </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/projects.js"></script>
</body>
</html>
