<!DOCTYPE html>
<html>
<head>
<title>Session Debug</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: system-ui, sans-serif; padding: 20px; background: #0f0f11; color: #e5e7eb; }
pre { background: #1a1a1e; border: 1px solid #2a2a2f; border-radius: 8px; padding: 16px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
h2 { font-size: 18px; margin-top: 24px; }
button { padding: 12px 20px; background: #ef4444; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 20px; width: 100%; }
</style>
</head>
<body>
<h1>Session Debug</h1>

<h2>localStorage nexaks_session:</h2>
<pre id="session">loading...</pre>

<h2>All localStorage keys:</h2>
<pre id="all">loading...</pre>

<h2>Supabase session (Discord OAuth):</h2>
<pre id="sb">checking...</pre>

<button onclick="clearAll()">Clear All Sessions & Reload</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
document.getElementById('session').textContent = 
  localStorage.getItem('nexaks_session') || '(none)';

let all = {};
for (let i = 0; i < localStorage.length; i++) {
  const k = localStorage.key(i);
  all[k] = localStorage.getItem(k);
}
document.getElementById('all').textContent = JSON.stringify(all, null, 2);

(async () => {
  try {
    if (window.NexaKS?.getCurrentUser) {
      const user = await window.NexaKS.getCurrentUser();
      if (user) {
        const profile = await window.NexaKS.getUserProfile(user.id).catch(() => null);
        document.getElementById('sb').textContent = JSON.stringify({
          user_id: user.id,
          discord_id: user.user_metadata?.provider_id,
          username: user.user_metadata?.full_name,
          profile_is_admin: profile?.is_admin,
          profile_username: profile?.username
        }, null, 2);
      } else {
        document.getElementById('sb').textContent = '(no Discord session)';
      }
    } else {
      document.getElementById('sb').textContent = '(NexaKS not loaded)';
    }
  } catch (e) {
    document.getElementById('sb').textContent = 'ERROR: ' + e.message;
  }
})();

function clearAll() {
  if (!confirm('Clear all localStorage and reload?')) return;
  localStorage.clear();
  window.location.reload();
}
</script>
</body>
</html>
